<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>播客精听室</title><link rel="stylesheet" href="style.css">
<header><strong>◖)) &nbsp; WORK ENGLISH</strong><span>播客精听室</span></header><main>
<section class="player"><div><small>正在精听</small><h1 id="title">聊聊相机测试</h1><p id="origin">英语对话 · 13 秒试听</p></div><details id="importer"><summary>导入播客</summary><form id="form"><label>音频直链<input id="url" type="url" placeholder="https://…/episode.mp3"></label><label>或选择本机音频<input id="file" type="file" accept="audio/*"></label><label>文稿文件（VTT、SRT、TXT）<input id="scriptFile" type="file" accept=".vtt,.srt,.txt"></label><label>或粘贴字幕／纯文本<textarea id="raw" rows="4"></textarea></label><label>或填写文稿直链<input type="url" id="scriptUrl"></label><button>载入音频与文稿</button><output id="problem" role="status"></output></form></details>
<div class="library"><label for="episodes">Civics 101 · 官方播客</label>
<select id="episodes" disabled><option value="">选择节目</option></select>
<small id="feedStatus" role="status"></small>
<div id="downloads" hidden><a id="srtLink" download>英文字幕 SRT</a> · <a id="txtLink" download>完整文稿 TXT</a></div></div>
<audio id="audio" controls preload="metadata" src="sample.wav"></audio><label class="rate">播放速度 <select id="speed"></select></label></section>
<div class="grid"><section><h2><button id="toggleCaptions" type="button" aria-expanded="true" aria-controls="captionPanel">收起字幕</button></h2><div id="captionPanel"><div class="toolbar"><label>点击正文 <select id="mode"><option value="word">复制单词</option><option value="line">复制整句</option><option value="mark">标记高亮</option><option value="seek">跳转播放</option><option value="align">用这句对齐当前播放位置</option></select></label><label><input type="checkbox" id="follow" checked> 跟随播放</label></div><div id="alignment" hidden><span id="offset"></span> <button id="resetOffset">重置对齐</button></div><div id="rows"></div></div></section>
<aside><small>学习摘录</small><h2>所选词句</h2><blockquote id="excerpt">点击正文，或拖选一段文字。</blockquote><label><input type="checkbox" id="withContext" checked> 复制时附上下文并存入文本库</label><button id="copy" disabled>复制所选内容</button><button id="ask" disabled>复制提问并打开 ChatGPT</button><p class="hint">提问含原句。在 ChatGPT 中粘贴后发送。</p><textarea id="fallback" hidden readonly aria-label="手动复制内容"></textarea><output id="notice" role="status"></output></aside></div><details id="library"><summary>我的文本库</summary><label>按标签、词句或节目查找 <input type="search" id="lookup"></label><div id="entries"></div></details></main><script src="app.js?v=sync2"></script><script src="frames.js?v=2"></script><script src="library.js?v=2"></script><script src="clips.js"></script></html>
