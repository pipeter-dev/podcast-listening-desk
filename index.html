<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>播客精听室</title><link rel="stylesheet" href="style.css?v=study3">
<header><strong>播客精听室</strong><nav aria-label="页内导航"><a href="#collection">选集</a><a href="#reading">字幕</a><a href="#library">文本库</a></nav></header><main>
<section class="player"><div class="episode-heading"><img id="cover" src="civics/cover.jpg" alt="" hidden><div><small id="series">正在精听</small><h1 id="title">聊聊相机测试</h1><p id="origin" role="status">英语对话 · 13 秒试听</p></div></div></section>
<section class="collection" id="collection"><details id="importer"><summary>导入播客</summary><form id="form"><label>音频直链<input id="url" type="url" placeholder="https://…/episode.mp3"></label><label>或选择本机音频<input id="file" type="file" accept="audio/*"></label><label>文稿文件（VTT、SRT、TXT）<input id="scriptFile" type="file" accept=".vtt,.srt,.txt"></label><label>或粘贴字幕／纯文本<textarea id="raw" rows="4"></textarea></label><label>或填写文稿直链<input type="url" id="scriptUrl"></label><button>载入音频与文稿</button><output id="problem" role="status"></output></form></details>
<div class="library"><label for="episodes">Civics 101 · 官方播客</label>
<select id="episodes" disabled><option value="">选择节目</option></select>
<small id="feedStatus" role="status"></small>
<div id="downloads" hidden><a id="srtLink" download>英文字幕 SRT</a> · <a id="txtLink" download>完整文稿 TXT</a></div></div>
</section><section class="transport" aria-label="播放控制"><span id="dockTitle" class="dock-title">聊聊相机测试</span>
<audio id="audio" controls playsinline preload="metadata" src="sample.wav"></audio><div class="transport-tools"><button type="button" id="back15" aria-label="后退15秒">↶ 15秒</button><button type="button" id="playToggle" aria-label="播放">▶ 播放</button><button type="button" id="ahead30" aria-label="前进30秒">+30 秒</button><label class="rate">倍速 <select id="speed" aria-label="播放速度"></select></label></div></section>
<div class="grid"><section id="reading"><div class="reading-head"><h2>同步文稿</h2><button id="toggleCaptions" type="button" aria-expanded="true" aria-controls="captionPanel">收起字幕</button></div><div id="captionPanel"><div class="toolbar"><label><input type="checkbox" id="follow" checked> 跟随播放</label></div><div id="alignment" hidden><span id="offset"></span> <button id="resetOffset">重置对齐</button></div><div id="rows" role="region" aria-label="可滚动的同步字幕" tabindex="0"></div></div></section>
<aside><h2>复制给 GPT 解析</h2><blockquote id="excerpt">点字幕里的词，再选择解析范围。</blockquote><div id="analysisActions">
<button data-scope="word" disabled>复制单词解析</button><button data-scope="sentence" disabled>复制整句解析</button><button data-scope="paragraph" disabled>复制段落解析</button><button data-scope="scene" disabled>复制对话情境解析</button><button data-scope="plain" disabled>只复制段落原文</button></div><small id="scopeInfo"></small>
<div class="cue-tools"><button id="markCue" disabled>标记此句</button><button id="alignCue" disabled>用此句对齐播放</button></div><label><input type="checkbox" id="withContext" checked> 复制时附上下文并存入文本库</label><button id="copy" disabled>复制所选内容</button><button id="ask" disabled>复制提问并打开 ChatGPT</button><p class="hint">提问含原句。在 ChatGPT 中粘贴后发送。</p><textarea id="fallback" hidden readonly aria-label="手动复制内容"></textarea><output id="notice" role="status"></output></aside></div><details id="library"><summary>我的文本库</summary><label>按标签、词句或节目查找 <input type="search" id="lookup"></label><div id="entries"></div></details></main><script src="study.js"></script><script src="app.js?v=study3"></script><script src="frames.js?v=2"></script><script src="library.js?v=study3"></script><script src="clips.js?v=study3"></script><script src="transport.js?v=study3"></script></html>
